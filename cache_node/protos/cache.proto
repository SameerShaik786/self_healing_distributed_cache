syntax = "proto3";

package cache;

service CacheService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message HeartbeatRequest {
  string node_id = 1;
  int64 timestamp = 2;
}

message HeartbeatResponse {
  string node_id = 1;
  bool alive = 2;
  int64 timestamp = 3;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  string value = 1;
  int32 version = 2;
  bool found = 3;
}

message PutRequest {
  string key = 1;
  string value = 2;
  int32 version = 3;
}

message PutResponse {
  bool success = 1;
  int32 version = 2;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
}
